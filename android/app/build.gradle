apply plugin: 'com.android.application'
// Applied unconditionally: the sherpa-onnx binding is Kotlin and is vendored in by
// scripts/build-sherpa-onnx.mjs. A build without it simply has no Kotlin to compile.
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    buildFeatures {
        buildConfig true
    }
    namespace = "rd.sheepskin.sandboxmusic"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "rd.sheepskin.sandboxmusic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "0.53.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    /*
     * Two distributions of the same app.
     *
     * gplay is the build published directly and through Play, and has Google Cast.
     * foss is the build F-Droid compiles. F-Droid only accepts free software, and
     * play-services-cast-framework is proprietary, so that flavour leaves Cast out entirely
     * rather than shipping a dependency that cannot be inspected. Everything else — the media
     * player, the locker, neural narration — is identical between them.
     *
     * UPnP and Sonos casting survive in both. Those run over the local network through
     * Sandbox Server and involve no Google code.
     */
    flavorDimensions += 'distribution'
    productFlavors {
        gplay {
            dimension 'distribution'
            isDefault = true
        }
        foss {
            dimension 'distribution'
        }
    }

    // Per-ABI APKs — youtubedl-android bundles Python + ffmpeg natives per arch (~50MB each).
    // Sideload arm64-v8a on OnePlus 12; skip universal fat APK (~200MB with all ABIs).
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Required by the vendored sherpa-onnx Kotlin binding.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.0"
    // Storage Access Framework tree traversal for the granted library folder (LibraryFolderPlugin).
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-common:1.5.1"
    // Cast, and the route picker it opens. gplay only: see the productFlavors block above.
    gplayImplementation "androidx.mediarouter:mediarouter:1.7.0"
    gplayImplementation "com.google.android.gms:play-services-cast-framework:21.5.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
