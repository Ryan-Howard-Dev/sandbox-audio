# Template for fdroiddata: metadata/rd.sheepskin.sandboxmusic.yml
# Copy into your fdroiddata MR. F-Droid builds from source tags and signs with the F-Droid key.
# Maintainer release keystore (android/keystore.properties) is NOT required for standard submission.
ApplicationId: rd.sheepskin.sandboxmusic

Categories:
  - Multimedia
License: GPL-3.0-only
SourceCode: https://github.com/Ryan-Howard-Dev/sandbox-audio
IssueTracker: https://github.com/Ryan-Howard-Dev/sandbox-audio/issues
Changelog: https://github.com/Ryan-Howard-Dev/sandbox-audio/releases
WebSite: https://ssrd.app

AutoName: Sandbox Audio
Name: Sandbox Audio
Summary: Self-hosted music locker and discovery console
Description: |-
  Sandbox Audio is an offline-first music locker, catalog explorer,
  and DJ console shell. Import local audio, browse charts, manage playlists,
  and optionally connect a Tier 3/4 backend for extended search and playback.

  Core locker playback works with local files. Catalog metadata and artist images
  use network services (iTunes Search API, MusicBrainz, Cover Art Archive,
  TheAudioDB). Many ecosystem features (Feed, acquire, Connect, full-stream
  playback, DLNA) require a self-hosted Tier 3/4 backend you operate. That
  backend uses yt-dlp against YouTube and similar platforms for acquire, podcast,
  and extended search paths. Air-Gap Mode blocks outbound client requests when
  enabled in Settings.

  Android builds include Google Cast (Play services) for LAN casting to TVs and
  receivers. Cast and catalog features require network access; locker playback
  does not.

  Application ID: rd.sheepskin.sandboxmusic

AntiFeatures:
  - Network
  - NonFreeNet
  - NonFreeDep
  - TetheredNet

RepoType: git
Repo: https://github.com/Ryan-Howard-Dev/sandbox-audio.git

Builds:
  # One block per architecture, and not for tidiness.
  #
  # Compiling sherpa-onnx is the slowest thing in this build, and doing it four times in one
  # container does not fit in the four hours F-Droid allows. Each block gets its own container
  # and its own budget, which is how Offline Translator (dev.davidv.translator) ships more than
  # one ABI. The versionCode for each is derived by VercodeOperation at the bottom of this file,
  # and those expressions must stay in step with abiVersionCodes in android/app/build.gradle.
  #
  # Bump versionName and the base versionCode alongside android/app/build.gradle before each
  # release. The per-ABI codes follow from the base and should not be written by hand.

  # armeabi-v7a
  - versionName: '1.0.0'
    versionCode: 11
    commit: v1.0.0
    subdir: android
    # The flavour without Google Cast. play-services-cast-framework is proprietary, so it
    # is confined to the gplay flavour and this build never links against it. Casting to
    # Sonos and UPnP speakers still works: that runs over the local network via Sandbox
    # Server and uses no Google code.
    gradle:
      - foss
    # Narrows the APK splits to this one architecture. See the splits block in
    # android/app/build.gradle.
    gradleprops:
      - targetAbi=armeabi-v7a
    # The NDK compiles sherpa-onnx from source. F-Droid rejects prebuilt binaries, so the
    # engine is built here rather than downloaded, which also keeps a hundred megabytes of
    # unreviewable binaries out of the repository.
    ndk: r27c
    # Four hours, which is F-Droid's ceiling. MakeACopy sets the same for the same reason:
    # it builds ONNX Runtime from source too.
    timeout: 14400
    prebuild:
      # F-Droid's source scanner reads build.gradle as text, so it flags the Cast dependency
      # on sight even though the foss flavour never compiles it. Deleting the line makes the
      # file say what this build actually is. The APK is scanned separately and contains no
      # Google code either way; this only stops a true statement being read as a false one.
      - sed -i '/play-services-cast-framework/d' app/build.gradle
      - cd ..
      - npm ci
      - npm run build:client
      # Builds the speech engine for this block's architecture only. Without the variable
      # the script defaults to arm64, and three of the four APKs would carry the voice model
      # with nothing able to read it.
      - SANDBOX_PIPER_ABI=armeabi-v7a node scripts/build-sherpa-onnx.mjs
      - npx cap sync android
    scandelete:
      - node_modules
      - .sherpa-build
      - android/.gradle
      - dist
    build:
      - ./gradlew assembleFossRelease

