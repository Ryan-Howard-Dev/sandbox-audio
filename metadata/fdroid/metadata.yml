# Reproducible build: see docs/fdroid.md and metadata/fdroid/README.md
# Local verify: npm run fdroid:local

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
# One expression per build block above, in the same order. F-Droid applies these to the
# upstream versionCode to derive a distinct code per architecture, and the app itself computes
# the same numbers in android/app/build.gradle. The two must agree, or F-Droid publishes codes
# that do not match the APKs it built.
#
# The ordering is deliberate: arm64-v8a must outrank armeabi-v7a, because a 64-bit phone can
# install either and takes the highest code it accepts.
VercodeOperation:
  - 10 * %c + 1  # armeabi-v7a
  - 10 * %c + 2  # x86
  - 10 * %c + 3  # arm64-v8a
  - 10 * %c + 4  # x86_64
CurrentVersion: '1.0.0'
CurrentVersionCode: 14
