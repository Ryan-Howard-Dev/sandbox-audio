ApplicationId: rd.sheepskin.sandboxmusic

Categories:
  - Multimedia
License: GPL-3.0-only
SourceCode: https://github.com/Ryan-Howard-Dev/sandbox-audio
IssueTracker: https://github.com/Ryan-Howard-Dev/sandbox-audio/issues
Changelog: https://github.com/Ryan-Howard-Dev/sandbox-audio/releases
WebSite: https://ssrd.app

AutoName: Sandbox Audio
Name: Sandbox Audio
Summary: Self-hosted music locker and discovery console
Description: |-
  Sandbox Audio is an offline-first music locker, catalog explorer,
  and DJ console shell. Import local audio, browse charts, manage playlists,
  and optionally connect a Tier 3/4 backend for extended search and playback.

  Core locker playback works with local files. Catalog metadata and artist images
  use network services (iTunes Search API, MusicBrainz, Cover Art Archive,
  TheAudioDB). Many ecosystem features (Feed, acquire, Connect, full-stream
  playback, DLNA) require a self-hosted Tier 3/4 backend you operate. That
  backend uses yt-dlp against YouTube and similar platforms for acquire, podcast,
  and extended search paths. Air-Gap Mode blocks outbound client requests when
  enabled in Settings.

  Android builds include Google Cast (Play services) for LAN casting to TVs and
  receivers. Cast and catalog features require network access; locker playback
  does not.

  Application ID: rd.sheepskin.sandboxmusic

AntiFeatures:
  - Network
  - NonFreeNet
  - NonFreeDep
  - TetheredNet

RepoType: git
Repo: https://github.com/Ryan-Howard-Dev/sandbox-audio.git

Builds:
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    # Bump versionCode/versionName with android/app/build.gradle before each F-Droid release.
    subdir: android
    # The flavour without Google Cast. play-services-cast-framework is proprietary, so it is
    # confined to the gplay flavour and this build never links against it. Casting to Sonos and
    # UPnP speakers still works here: that runs over the local network and uses no Google code.
    gradle:
      - foss
    # The NDK compiles sherpa-onnx from source. F-Droid rejects prebuilt binaries, so the
    # engine is built here rather than downloaded as an AAR — which also keeps a hundred
    # megabytes of unreviewable binaries out of the repository.
    ndk: r27c
    # Compiling sherpa-onnx from source runs well past the default. MakeACopy, which builds
    # ONNX Runtime the same way, sets the same ceiling.
    timeout: 14400
    prebuild:
      # F-Droid's source scanner reads build.gradle as text, so it flags the Cast dependency on
      # sight even though the foss flavour never compiles it. Deleting the line makes the file
      # say what this build actually is. The APK is checked separately and has no Google code
      # in it either way; this only stops a true statement being read as a false one.
      - sed -i '/play-services-cast-framework/d' app/build.gradle
      - cd ..
      - npm ci
      - npm run build:client
      - node scripts/build-sherpa-onnx.mjs
      - npx cap sync android
    scandelete:
      - node_modules
      - .sherpa-build
      - android/.gradle
      - dist
    build:
      - ./gradlew assembleFossRelease

# Reproducible build: see docs/fdroid.md and metadata/fdroid/README.md
# Local verify: npm run fdroid:local

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
