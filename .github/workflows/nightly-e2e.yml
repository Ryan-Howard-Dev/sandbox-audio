name: Nightly E2E

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  android-smoke:
    name: Android smoke E2E (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Enable KVM
        # ubuntu-latest ships /dev/kvm but not the group permission, so an x86_64 AVD never
        # boots -- adb retries until the job times out. This is why every emulator job here
        # has been failing. Documented prerequisite of android-emulator-runner.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            npm run build:android:apk
            chmod +x scripts/android-smoke-e2e.sh
            SKIP_BUILD=1 scripts/android-smoke-e2e.sh
