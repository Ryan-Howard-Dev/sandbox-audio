<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sandbox Audio — self-hosted music locker and discovery shell." />
    <meta name="theme-color" content="#07080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sandbox Audio" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Sandbox Audio</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #07080c;
        color: #f0f0f0;
        min-height: 100%;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
    <!--
      Google's Cast sender SDK is deliberately not loaded here.

      It used to be, ungated, so every launch on every platform fetched it from gstatic.com. It was
      the slowest single resource in startup at 198ms measured on the OnePlus, and on Android it was
      never even used: the native Cast plugin does that work. The F-Droid build has no Cast at all
      and was still calling Google on every start, which is exactly what air-gap mode promises it
      will not do.

      castSender.ts injects it on demand the first time someone actually opens the cast picker in a
      browser, and already handles it being absent. Nothing needs it before then.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
